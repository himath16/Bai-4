<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web Figma Wireframe</title>
    <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo">Logo</div>
        <div class="menu">Menu</div>
        <div class="btn">Button</div>
    </header>

    <section class="hero-section">
        <div class="hero-content">Content</div>
        <div class="hero-image">Image</div>
    </section>

    <section class="section">
        <div class="title">Title</div>
        <div class="grid-3">
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
        </div>
    </section>

    <section class="section">
        <div class="title">Title</div>
        <div class="grid-5">
            <div class="item-small">Item</div>
            <div class="item-small">Item</div>
            <div class="item-small">Item</div>
            <div class="item-small">Item</div>
            <div class="item-small">Item</div>
        </div>
    </section>

    <section class="section">
        <div class="title">Title</div>
        <div class="grid-4">
            <div class="item-medium">Item</div>
            <div class="item-medium">Item</div>
            <div class="item-medium">Item</div>
            <div class="item-medium">Item</div>
        </div>
    </section>

    <footer class="footer">
        Footer
    </footer>

</body>
</html>
